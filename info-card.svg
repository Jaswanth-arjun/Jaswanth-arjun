<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300" role="img" aria-label="neofetch-style profile info card">
  <style>
    .bg{fill:#0d1117;stroke:#21262d;stroke-width:1}
    .title{fill:#8b949e;font:11.5px ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace}
    .v{fill:#e6edf3;font:13px ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace}
    .prompt{fill:#8b949e;font:12.5px ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace}
    .cursor{fill:#39d353}
    .divider{stroke:#21262d;stroke-width:1}
    .k0{fill:#7ee787} .k1{fill:#79c0ff} .k2{fill:#ffa657} .k3{fill:#d2a8ff} .k4{fill:#ff7b72} .k5{fill:#56d4dd}
    .row{animation:print .5s cubic-bezier(.22,.61,.36,1) both}@keyframes print{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:translateX(0)}}.cursor{animation:blink 1.1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
    @media (prefers-color-scheme: light){
      .bg{fill:#f6f8fa;stroke:#d0d7de}
      .title{fill:#59636e}
      .v{fill:#1f2328}
      .prompt{fill:#59636e}
      .divider{stroke:#d0d7de}
      .k0{fill:#1a7f37} .k1{fill:#0550ae} .k2{fill:#bc4c00} .k3{fill:#8250df} .k4{fill:#cf222e} .k5{fill:#0969da}
    }
  </style>
  <rect class="bg" x="0.5" y="0.5" width="619" height="299" rx="12"/>
  <circle cx="20" cy="19" r="5" fill="#ff5f56"/><circle cx="36" cy="19" r="5" fill="#ffbd2e"/><circle cx="52" cy="19" r="5" fill="#27c93f"/>
