  <line class="divider" x1="1" y1="38" x2="619" y2="38"/>
  <g class="row" style="animation-delay:0.15s"><text class="k0" x="28" y="70" font-weight="700">Now</text><text class="v" x="122" y="70">Full-Stack &amp; AI Developer · building in public</text></g><g class="row" style="animation-delay:0.28s"><text class="k1" x="28" y="100" font-weight="700">Prev</text><text class="v" x="122" y="100">Campus-Connection · MailMind-AI · recoveriq-pro</text></g><g class="row" style="animation-delay:0.41s"><text class="k2" x="28" y="130" font-weight="700">Stack</text><text class="v" x="122" y="130">TypeScript · JavaScript · Java · Python · Dart · PHP</text></g><g class="row" style="animation-delay:0.54s"><text class="k3" x="28" y="160" font-weight="700">Focus</text><text class="v" x="122" y="160">AI agents · RAG · resume &amp; job automation</text></g><g class="row" style="animation-delay:0.67s"><text class="k4" x="28" y="190" font-weight="700">Highlights</text><text class="v" x="122" y="190">54 public repos across web, AI &amp; mobile</text></g><g class="row" style="animation-delay:0.80s"><text class="k5" x="28" y="220" font-weight="700">GitHub</text><text class="v" x="122" y="220">7 followers · shipping daily</text></g>
